# Construit l'installateur Windows sur un vrai Windows et publie la version sur GitHub.
# Ne se déclenche QUE sur la branche « publication » : la branche main sert au travail en cours, sans rien publier.
# Pour publier (sur feu vert du propriétaire) : pousser main vers publication. Si la version de package.json
# n'est pas encore publiée, l'installateur est construit et la version vX.Y.Z est créée (avec son étiquette).
# Les jeux déjà installés trouvent la nouvelle version au lancement et se mettent à jour tout seuls.
name: Publier une version

on:
  push:
    branches: [publication]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cette version est-elle déjà publiée ?
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La version $V est déjà publiée : rien à faire."; echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "Nouvelle version $V : construction."; echo "skip=0" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip == '0'
        with:
          node-version: 22
          cache: npm
      - name: Installer les outils
        if: steps.check.outputs.skip == '0'
        run: npm ci
      - name: Construire l'installateur
        if: steps.check.outputs.skip == '0'
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win --x64 --publish never 2>&1 | tee build.log || {
            grep -iE "error|⨯|failed|status|message" build.log | tail -n 10 | sed 's/%/%25/g' | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          ls -la dist
      - name: Publier la version (installateur + fichiers de mise à jour)
        if: steps.check.outputs.skip == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          V=${{ steps.check.outputs.version }}
          EXE="dist/Gardien-de-la-Lanterne-Setup-$V.exe"
          # latest.yml : c'est ce fichier que les jeux installés lisent pour se mettre à jour tout seuls
          if [ ! -f dist/latest.yml ]; then
            node -e "const fs=require('fs'),c=require('crypto'),f=process.argv[1],b=fs.readFileSync(f),h=c.createHash('sha512').update(b).digest('base64'),n=require('path').basename(f);fs.writeFileSync('dist/latest.yml','version: '+process.argv[2]+'\nfiles:\n  - url: '+n+'\n    sha512: '+h+'\n    size: '+b.length+'\npath: '+n+'\nsha512: '+h+'\nreleaseDate: \''+new Date().toISOString()+'\'\n')" "$EXE" "$V"
          fi
          cat dist/latest.yml
          FILES="$EXE dist/latest.yml"; [ -f "$EXE.blockmap" ] && FILES="$FILES $EXE.blockmap"
          gh release create "v$V" $FILES --repo "$GITHUB_REPOSITORY" --title "$V" --notes "Version $V du Gardien de la Lanterne" --target "$GITHUB_SHA"
          gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
